name: Bug report
description: Report a reproducible MotionGuard for Hue problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include Hue application keys, HomeKit setup codes, passwords, or private network details."
  - type: input
    id: version
    attributes:
      label: MotionGuard version
      placeholder: 0.6.1
    validations:
      required: true
  - type: input
    id: homebridge
    attributes:
      label: Homebridge version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: shell
